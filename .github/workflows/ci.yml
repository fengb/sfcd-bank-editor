name: ci

on:
  push:
    paths:
      - '**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run check
